name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: unit tests
        run: npm test
      - name: doctor on a scaffolded project
        run: |
          node scripts/init.mjs --scaffold "$RUNNER_TEMP/demo"
          DSH_HOME="$RUNNER_TEMP/home" \
          MEMORY_DIR="$RUNNER_TEMP/demo/memory" \
          MEMORY_PROJECT="$RUNNER_TEMP/demo/AGENTS.snippet.md" \
          node scripts/memory-doctor.mjs --json || true
